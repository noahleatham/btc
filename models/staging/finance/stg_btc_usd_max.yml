version: 2

models:
  - name: stg_btc_usd_max
    description: Staging model for Bitcoin to USD price data with proper timestamp casting
    columns:
      - name: snapped_at
        description: Timestamp when the data was captured
        data_type: timestamp
        tests:
          - not_null
          - unique
      - name: price
        description: Bitcoin price in USD
        data_type: float
        tests:
          - not_null
      - name: market_cap
        description: Market capitalization in USD
        data_type: float
        tests:
          - not_null
      - name: total_volume
        description: Total trading volume in USD
        data_type: float